name: Build and deploy
on:
  schedule:
    # monday, wednesday, friday at 6:00
    - cron: 0 6 * * 1,3,5
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  ITCHIO_USERNAME: nokorpo
  ITCHIO_GAME: gato-godot-accessibility-toolkit
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

jobs:

  should-make-new-build:
    name: Check if a new build should be generated
    runs-on: ubuntu-latest
    container:
      image: nokorpo/godot-tests:4.6
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: true
      - name: Check last commit date
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          # A new build will be triggered only if there are commits in the last
          # $BUILD_TRIGGER_WINDOW number of days. If last commit was on Tuesday
          # and this runs on Wednesday, it will trigger a build. If the last
          # commit was on Saturday, it will not.
          BUILD_TRIGGER_WINDOW=$(( 3 * 86400 ))      # 86400 = 1 day in seconds

          last_commit_ts=$(git log -1 --format=%ct 2>/dev/null)
          current_ts=$(date +%s)

          if [ $(( current_ts - last_commit_ts )) -gt "$BUILD_TRIGGER_WINDOW" ]; then
            echo "Last commit is older than 5 days, not making a new build. Skipping." >&2
            exit 1
          else
            echo "Last commit is with the 5 days window. Making a new build." >&2
            exit 0
          fi

  linux:
    name: Linux build
    needs: should-make-new-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nokorpo/godot-tests:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: true

      - name: Build Linux
        run: |
          if [ ! -d ~/.local/share/godot/export_templates ]; then
            mkdir -p ~/.local/share/godot/export_templates/
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

          godot --headless --import
          mkdir -p ./build/linux/
          godot --headless --export-release "Linux" ./build/linux/gato

      - name: Itch.io Deploy
        run: |
          butler push ./build/linux/ $ITCHIO_USERNAME/$ITCHIO_GAME:linux

  windows:
    name: Windows build
    needs: should-make-new-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nokorpo/godot-tests:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          lfs: true

      - name: Build Windows
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          godot --headless --import
          mkdir -p ./build/windows/
          godot --headless --export-release "Windows" ./build/windows/gato.exe

      - name: Itch.io Deploy
        run: |
          butler push ./build/windows/ $ITCHIO_USERNAME/$ITCHIO_GAME:windows


  discord-notifications:
    needs: [linux, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build OK Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ env.DISCORD_EMBEDS }}
        uses: Ilshidur/action-discord@master
        with:
          args: "New builds available in [this url](https://nokorpo.itch.io/gato-godot-accessibility-toolkit?secret=GAK8HFopdJMBYuNUPkZChGTc)! 📦️"

      - name: Build KO Discord notification
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ env.DISCORD_EMBEDS }}
        uses: Ilshidur/action-discord@master
        with:
          args: "❌️ Error while trying to build and publish to itch.io. Check [last run in Github](https://github.com/Nokorpo/gato-godot-accessibility-toolkit/actions/workflows/release.yaml)."

